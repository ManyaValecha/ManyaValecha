
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ManyaValecha
          outputs: |
            dist/github-snake.svg?color_snake=%23c084fc&color_dots=%230d0618,%23301b4b,%235b2a86,%239b72cf,%23e9d5ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23c084fc&color_dots=%230d0618,%23301b4b,%235b2a86,%239b72cf,%23e9d5ff

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
